<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lingua — английский каждый день</title>
  <meta name="description" content="500+ слов B1–C1, карточки с интервальным повторением, тренажёры и грамматика.">

  <!-- Мобильное приложение (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fafaf9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lingua">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Тема применяется до отрисовки, чтобы не было «вспышки» светлого фона -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('lingua.v1') || '{}');
        var t = s.theme || document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    if (window.tailwind) tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-stone-50 text-stone-900 dark:bg-[#0e1013] dark:text-stone-100 font-sans antialiased selection:bg-teal-200 dark:selection:bg-teal-800">

  <!-- Шапка -->
  <header class="sticky top-0 z-30 border-b border-stone-200/70 dark:border-white/5 bg-stone-50/80 dark:bg-[#0e1013]/80 backdrop-blur-xl">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center gap-4">
      <a href="#dashboard" class="flex items-center gap-2 shrink-0">
        <img src="icons/favicon.png" alt="" width="36" height="36" class="w-9 h-9 rounded-xl">
        <span class="font-display text-xl font-semibold tracking-tight">Lingua</span>
      </a>

      <nav id="nav-desktop" class="hidden md:flex items-center gap-1 ml-4"></nav>

      <div class="ml-auto flex items-center gap-2">
        <span id="header-streak" class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold bg-orange-100 text-orange-700 dark:bg-orange-500/15 dark:text-orange-300" title="Дней подряд">🔥 0</span>
        <button id="theme-toggle" type="button" data-action="toggle-theme"
          class="grid place-items-center w-10 h-10 rounded-xl hover:bg-stone-200/70 dark:hover:bg-white/10 transition" aria-label="Сменить тему"></button>
      </div>
    </div>
  </header>

  <!-- Контент текущего раздела -->
  <main id="view" class="max-w-5xl mx-auto px-4 pt-6 sm:pt-8 pb-32 md:pb-16"></main>

  <!-- Нижняя навигация (мобильные) -->
  <nav id="nav-mobile"
    class="md:hidden fixed bottom-0 inset-x-0 z-30 border-t border-stone-200/70 dark:border-white/5 bg-white/90 dark:bg-[#15181c]/90 backdrop-blur-xl grid grid-cols-5"
    style="padding-bottom: env(safe-area-inset-bottom)"></nav>

  <!-- Уведомления -->
  <div id="toasts" class="fixed z-50 bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-none w-[min(92vw,420px)]"></div>

  <!-- Скрытый input для импорта прогресса -->
  <input id="import-file" type="file" accept="application/json,.json" class="hidden">

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">Для работы Lingua нужно включить JavaScript.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="words-b1.js"></script>
  <script src="words-b2.js"></script>
  <script src="words-c1.js"></script>
  <script src="app.js"></script>
</body>
</html>
